<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - TechSpark Fest 2026</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 16px 30px;
            background-color: #000000;
            border-bottom: 1px solid #30363d;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2a9d8f;
        }

        .menu {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .menu a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .menu a:hover,
        .menu a.active {
            color: #2a9d8f;
        }

        /* Form Container */
        .container {
            max-width: 600px;
            width: 90%;
            margin: 40px auto;
            background-color: #161b22;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid #30363d;
        }

        h1 {
            color: #2a9d8f;
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #e6edf3;
        }

        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus {
            border-color: #2a9d8f;
            box-shadow: 0 0 0 3px rgba(42, 157, 143, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #2a9d8f;
            color: #000000;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #e0f4f1;
            transform: translateY(-1px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2a9d8f;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: auto;
            background-color: #000000;
            color: #8b949e;
            text-align: center;
            padding: 18px;
            border-top: 1px solid #30363d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">TechSpark Fest 2026</div>
        <nav>
            <ul class="menu">
                <li><a href="index.html">HOME</a></li>
                <li><a href="form.html" class="active">REGISTRATIONS</a></li>
                <li><a href="gallery.html">GALLERY</a></li>
                <li><a href="tables.html">EVENTS</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1>Event Registration</h1>
        <p class="subtitle">Fill in your details below to register for TechSpark Fest 2026</p>

        <form action="#" method="post" onsubmit="event.preventDefault(); alert('Registration Submitted Successfully!');">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="regno">Register Number:</label>
                <input type="text" id="regno" name="regno" placeholder="e.g. 26112010" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="event">Select Event:</label>
                <select id="event" name="event" required>
                    <option value="" disabled selected>-- Choose an Event --</option>
                    <option value="music">Music Night - 20th December</option>
                    <option value="campfire">Campfire Night - 21st December</option>
                    <option value="dance">Dance Night / Annual Ball - 23rd December</option>
                    <option value="hackathon">Hackathon - 24th December</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Submit Registration</button>
        </form>

        <a href="index.html" class="back-link">&larr; Back to Home</a>
    </div>

    <footer>
        <p>&copy; 2026 TechSpark Fest. All rights reserved.</p>
    </footer>
</body>
</html>
